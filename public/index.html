<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر التوفير</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tahoma', Arial; background: #f4f6f9; padding: 15px; }
    .container { max-width: 600px; margin: auto; }
    h1 { color: #e12b2b; text-align: center; margin: 20px 0; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 30px; font-size: 16px; }
    button { padding: 12px 25px; background: #e12b2b; color: white; border: none; border-radius: 30px; font-size: 16px; }
    .product-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .product-card img { width: 100%; height: 200px; object-fit: contain; }
    .product-card h3 { font-size: 16px; margin: 10px 0; }
    .product-card p { color: #e12b2b; font-weight: bold; }
    .buy-btn { display: block; text-align: center; background: #ff9900; color: white; padding: 12px; border-radius: 30px; text-decoration: none; margin-top: 10px; }
    .loading { text-align: center; margin: 30px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛍️ متجر التوفير</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن سماعة، ساعة...">
      <button onclick="search()">بحث</button>
    </div>
    <div class="loading" id="loading">⏳ جاري التحميل...</div>
    <div id="results"></div>
  </div>
  <script>
    async function search() {
      const keyword = document.getElementById('searchInput').value;
      if (!keyword) return alert('اكتب اسم المنتج');
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').innerHTML = '';
      try {
        const res = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword })
        });
        const products = await res.json();
        document.getElementById('loading').style.display = 'none';
        if (products.error) return alert(products.error);
        let html = '';
        products.forEach(p => {
          html += `
            <div class="product-card">
              <img src="${p.image}" alt="${p.title}">
              <h3>${p.title}</h3>
              <p>${p.price}</p>
              <a href="${p.link}" target="_blank" class="buy-btn">اشتري الآن 🛒</a>
            </div>
          `;
        });
        document.getElementById('results').innerHTML = html || 'لا توجد منتجات';
      } catch(e) {
        document.getElementById('loading').style.display = 'none';
        alert('حصل خطأ في الاتصال بالسيرفر');
      }
    }
  </script>
</body>
</html>
